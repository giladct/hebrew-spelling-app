<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>לומדים לקרוא עברית</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐫</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="homeScreen">
      <div id="homeLogo">🐫</div>
      <h1>לוֹמְדִים לִקְרוֹא עִבְרִית</h1>
      <p class="subtitle">בִּחֲרוּ שָׁלָב לְהַתְחִיל</p>
      <button id="continueBtn" class="hidden">הַמְשֵׁךְ מֵאֵיפֹה שֶׁהִפְסַקְתָּ ←</button>
      <button id="nextLevelBtn" class="hidden">לְשָׁלָב הַבָּא ←</button>
      <div id="stageCards"></div>
    </div>

    <div id="gameScreen" class="hidden">
      <header>
        <button id="homeBtn">🏠 בַּיִת</button>
        <div id="headerTitle">
          <h1 id="headerLevelTitle">לוֹמְדִים לִקְרוֹא עִבְרִית</h1>
          <div id="progress">שלב <span id="gameStageNum">1</span> - מָסָךְ <span id="wordIndex">1</span> מִתּוֹךְ <span id="wordTotal">5</span></div>
          <div id="attemptsEl" class="hidden">❌ <span id="attemptsCount">0</span></div>
        </div>
      </header>

      <main>
        <button id="skipBtn">⏭️ דְּלַג</button>

        <div id="pictureBox"></div>

        <div id="actionRow">
          <button id="hintBtn">🔊 הַשְׁמַע מִלָּה</button>
        </div>

        <div id="slots"></div>

        <div id="tray"></div>

        <div id="feedback"></div>
      </main>

      <button id="nextBtn" class="hidden">הַבָּא ←</button>
    </div>

    <div id="syllableMatchScreen" class="hidden">
      <header>
        <button id="smHomeBtn">🏠 בַּיִת</button>
        <div id="smTitle"></div>
      </header>
      <main id="smMain">
        <button id="smSkipBtn">⏭️ דְּלַג</button>
        <p id="smInstruction">גְּרוֹר אֶת הַהַבָרָה הַנְּכוֹנָה לָרִיבּוּעַ הַמַּתְאִים</p>
        <div id="smRows"></div>
        <div id="smFeedback"></div>
        <div id="smTileBar"></div>
      </main>
      <button id="smNextBtn" class="hidden">הַבָּא ←</button>
    </div>

    <div id="dualWordScreen" class="hidden">
      <header>
        <button id="dw10HomeBtn">🏠 בַּיִת</button>
        <div id="dw10Title"></div>
      </header>
      <main id="dw10Main">
        <button id="dw10SkipBtn">⏭️ דְּלַג</button>
        <p id="dw10Instruction">גְּרוֹר כָּל הַבְרָה אֶל הַצִּיּוּר הַנָּכוֹן</p>
        <div id="dw10Rows"></div>
        <div id="dw10Feedback"></div>
        <div id="dw10Tray"></div>
      </main>
      <button id="dw10NextBtn" class="hidden">הַבָּא ←</button>
    </div>
  </div>

  <script src="audio/tiles.js?v=3"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
